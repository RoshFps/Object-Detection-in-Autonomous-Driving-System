name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless pyserial bandit
      - name: Unit tests (serial link, lane logic, calibration)
        run: python -m unittest discover -s tests -t . -v
      - name: Static analysis on project code (bandit)
        run: bandit -q serial_test.py LaneDetection.py utlis.py road_sign.py
